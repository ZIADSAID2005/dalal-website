<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Sign In</title>
    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background-color: #89a8b2;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      .form-wrapper {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
      }

      .form-container {
        background-color: #f2efe7;
        padding: 30px;
        border-radius: 12px;
        box-shadow: 0 0 20px rgba(0, 0, 0, 0.2);
        width: 320px;
      }

      h2 {
        text-align: center;
        margin-bottom: 20px;
        color: #333;
      }

      input[type="text"],
      input[type="password"] {
        width: 100%;
        padding: 12px;
        margin-bottom: 15px;
        border-radius: 6px;
        border: 1px solid #ccc;
        font-size: 14px;
      }

      button {
        width: 100%;
        padding: 12px;
        background-color: #89a8b2;
        color: white;
        border: none;
        border-radius: 6px;
        font-size: 16px;
        cursor: pointer;
        transition: background-color 0.3s;
      }

      button:hover {
        background-color: #6c8f99;
      }

      .logout-btn {
        background-color: #ccc;
        color: #333;
        margin-top: 10px;
      }

      .logout-btn:hover {
        background-color: #aaa;
      }

      .message {
        text-align: center;
        color: green;
        margin-top: 15px;
        font-weight: bold;
      }

      .disabled {
        opacity: 0.6;
        pointer-events: none;
      }

      .back {
        display: block;
        text-align: center;
        margin-top: 15px;
        color: #666;
        text-decoration: none;
        font-size: 14px;
      }

      .back:hover {
        text-decoration: underline;
      }
    </style>
  </head>
  <body>
    <div class="form-wrapper">
      <div class="form-container">
        <h2>Sign In</h2>
        <form id="loginForm">
          <input type="text" id="username" placeholder="Username" required />
          <input
            type="password"
            id="password"
            placeholder="Password"
            required
          />
          <button type="submit">Login</button>
        </form>
        <div class="message" id="messageBox"></div>
        <button class="logout-btn" id="logoutBtn" style="display: none">
          Logout
        </button>
        <a class="back" href="test.html">← Back to Home</a>
      </div>
    </div>

    <script>
      const form = document.getElementById("loginForm");
      const messageBox = document.getElementById("messageBox");
      const usernameInput = document.getElementById("username");
      const passwordInput = document.getElementById("password");
      const loginButton = form.querySelector("button");
      const logoutBtn = document.getElementById("logoutBtn");

      // Check if already logged in
      if (localStorage.getItem("loggedIn") === "true") {
        const savedUsername = localStorage.getItem("username");
        messageBox.textContent = `You are already logged in, ${savedUsername} ✅`;
        disableForm();
        logoutBtn.style.display = "block";
      }

      form.addEventListener("submit", function (event) {
        event.preventDefault();

        const username = usernameInput.value;
        const password = passwordInput.value;

        if (username && password) {
          localStorage.setItem("loggedIn", "true");
          localStorage.setItem("username", username);
          messageBox.textContent = `Welcome, ${username}! Login successful ✅`;
          disableForm();
          logoutBtn.style.display = "block";
        } else {
          messageBox.textContent = "Please fill in all fields ❌";
          messageBox.style.color = "red";
        }
      });

      logoutBtn.addEventListener("click", function () {
        localStorage.removeItem("loggedIn");
        localStorage.removeItem("username");
        location.reload();
      });

      function disableForm() {
        usernameInput.disabled = true;
        passwordInput.disabled = true;
        loginButton.disabled = true;
        form.classList.add("disabled");
      }
    </script>
  </body>
</html>
